DDEX\DSR\DSR_430\MembershipType:
    properties:
        organization:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        membershipType:
            -
                Choice:
                    choices:
                        - NationalMember
                        - RegionalMember
                        - WorldwideMember
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        startDate:
            -
                Regex:
                    pattern: '~[0-9]{4}(-[0-9]{2}){0,1}(-[0-9]{2}){0,1}~u'
                    groups:
                        - xsd_rules
        endDate:
            -
                Regex:
                    pattern: '~[0-9]{4}(-[0-9]{2}){0,1}(-[0-9]{2}){0,1}~u'
                    groups:
                        - xsd_rules
