                        - DjMix
                        - LongFormMusicalWorkVideo
                        - MixedMedia
                        - Ringtone
                        - SimpleAudioSingle
                        - SimpleVideoSingle
                        - Video
                    groups:
                        - xsd_rules
        releaseProfileVariantVersionId:
            -
                Choice:
                    choices:
                        - BoxedSet
                        - 'BoxedSet Classical'
