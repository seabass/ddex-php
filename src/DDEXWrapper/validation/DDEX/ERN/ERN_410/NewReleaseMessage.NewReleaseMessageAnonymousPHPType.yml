                Count:
                    min: 1
                    groups:
                        - xsd_rules
            -
                Valid: null
        cueSheetList:
            -
                Valid: null
        resourceList:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        chapterList:
            -
                Valid: null
        releaseList:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        dealList:
            -
                Valid: null
        supplementalDocumentList:
            -
                Valid: null
