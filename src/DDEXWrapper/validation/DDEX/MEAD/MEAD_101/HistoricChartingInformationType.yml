DDEX\MEAD\MEAD_101\HistoricChartingInformationType:
    properties:
        metadataSourceReference:
            -
                All:
                    constraints:
                        -
                            Regex:
                                pattern: '~U[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
        territoryCode:
            -
                NotNull:
                    groups:
                        - xsd_rules
        chartName:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        topPosition:
            -
                Regex:
                    pattern: '~[\-+]?[0-9]+~u'
                    groups:
                        - xsd_rules
        chartEntry:
            -
                Valid: null
