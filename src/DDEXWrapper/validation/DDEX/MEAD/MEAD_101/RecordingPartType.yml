DDEX\MEAD\MEAD_101\RecordingPartType:
    properties:
        sequenceNumber:
            -
                Regex:
                    pattern: '~[\-+]?[0-9]+~u'
                    groups:
                        - xsd_rules
        metadataSourceReference:
            -
                All:
                    constraints:
                        -
                            Regex:
                                pattern: '~U[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
        unit:
            -
                Choice:
                    choices:
                        - Millisecond
                        - Second
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        comment:
            -
                Valid: null
