                NotNull:
                    groups:
                        - xsd_rules
        resourceMusicalWorkReferenceList:
            -
                Valid: null
        resourceContainedResourceReferenceList:
            -
                Valid: null
        title:
            -
                Valid: null
        userDefinedResourceDetailsByTerritory:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        musicalWorkRightsClaimType:
            -
                All:
                    constraints:
                        -
                            Choice:
                                choices:
                                    - CopyrightControl
                                    - NonMemberClaim
                                    - PublicDomain
                                    - SocietyClaim
                                    - Unknown
                    groups:
                        - xsd_rules
