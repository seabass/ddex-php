DDEX\MWN\MWN_US_LIC_100\LicenseConditionType:
    properties:
        licenseConditionReference:
            -
                Regex:
                    pattern: '~E[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        rightsType:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                All:
                    constraints:
                        -
                            Choice:
                                choices:
                                    - MechanicalRight
                                    - PerformingRight
                                    - PrintRight
                                    - SynchronizationRight
                    groups:
                        - xsd_rules
        usage:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        royaltyRate:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        supplementalDocument:
            -
                Valid: null
        rateValidity:
            -
                Valid: null
        priceInformation:
            -
                Valid: null
        technicalInstantiation:
            -
                Valid: null
