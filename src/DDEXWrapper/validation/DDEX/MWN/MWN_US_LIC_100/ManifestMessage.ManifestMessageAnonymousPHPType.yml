DDEX\MWN\MWN_US_LIC_100\ManifestMessage\ManifestMessageAnonymousPHPType:
    properties:
        messageVersionId:
            -
                NotNull:
                    groups:
                        - xsd_rules
        avsVersionId:
            -
                Choice:
                    choices:
                        - '0.1'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        messageHeader:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        isTestFlag:
            -
                NotNull:
                    groups:
                        - xsd_rules
        messageNotificationPeriod:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        rootDirectory:
            -
                NotNull:
                    groups:
                        - xsd_rules
        numberOfMessages:
            -
                Regex:
                    pattern: '~[\-+]?[0-9]+~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        messageInBatch:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
