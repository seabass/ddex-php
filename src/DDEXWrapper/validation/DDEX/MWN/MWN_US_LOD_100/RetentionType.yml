DDEX\MWN\MWN_US_LOD_100\RetentionType:
    properties:
        retentionDate:
            -
                Regex:
                    pattern: '~[0-9]{4}(-[0-9]{2}){0,1}(-[0-9]{2}){0,1}~u'
                    groups:
                        - xsd_rules
