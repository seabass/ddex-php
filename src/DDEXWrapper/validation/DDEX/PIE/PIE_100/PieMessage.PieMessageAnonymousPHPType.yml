DDEX\PIE\PIE_100\PieMessage\PieMessageAnonymousPHPType:
    properties:
        avsVersionId:
            -
                NotNull:
                    groups:
                        - xsd_rules
        languageAndScriptCode:
            -
                Regex:
                    pattern: '~[a-zA-Z]{2,3}(-[a-zA-Z]+){0,1}(-[a-zA-Z]{2}|-[0-9]{3}){0,1}(-[a-zA-Z][a-zA-Z0-9]{4}[a-zA-Z0-9]*){0,1}~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        messageHeader:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        metadataSourceList:
            -
                Valid: null
        partyList:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Count:
                    min: 1
                    groups:
                        - xsd_rules
            -
                Valid: null
