DDEX\RIN\RIN11M\SoundRecordingType:
    properties:
        displayArtistName:
            -
                NotNull:
                    groups:
                        - xsd_rules
        displayArtist:
            -
                Valid: null
        soundRecordingId:
            -
                Valid: null
        resourceReference:
            -
                Regex:
                    pattern: '~A[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        title:
            -
                Valid: null
        rightsController:
            -
                Valid: null
        pLine:
            -
                Valid: null
        genre:
            -
                Valid: null
        soundRecordingMusicalWorkReference:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                All:
                    constraints:
                        -
                            Regex:
                                pattern: '~W[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
        contributor:
            -
                Valid: null
        soundRecordingProjectReference:
            -
                All:
                    constraints:
                        -
                            Regex:
                                pattern: '~J[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
        soundRecordingSessionReference:
            -
                All:
                    constraints:
                        -
                            Regex:
                                pattern: '~O[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
        audioChannelConfiguration:
            -
                Choice:
                    choices:
                        - BinauralAudio
                        - LCR
                        - Mono
                        - MultichannelAudio
                        - MultiTrack
                        - Quad
                        - Stems
                        - Stereo
                        - SurroundSound
                        - Unknown
                    groups:
                        - xsd_rules
