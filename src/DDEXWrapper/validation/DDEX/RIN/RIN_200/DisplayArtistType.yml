DDEX\RIN\RIN_200\DisplayArtistType:
    properties:
        sequenceNumber:
            -
                Regex:
                    pattern: '~[\-+]?[0-9]+~u'
                    groups:
                        - xsd_rules
        partyReference:
            -
                Regex:
                    pattern: '~P[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        titleDisplayInformation:
            -
                Valid: null
        artisticRole:
            -
                NotNull:
                    groups:
                        - xsd_rules
