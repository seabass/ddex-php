DDEX\RIN\RIN_200\GenreCategoryValueType:
    properties:
        __value:
            -
                Choice:
                    choices:
                        - Blues
                        - ClassicalMusic
                        - CountryMusic
                        - ElectronicMusic
                        - Folk
                        - Gospel
                        - HipHop
                        - Jazz
                        - Latin
                        - Pop
                        - "R'n'B"
                        - Reggae
                        - Rock
                        - Spoken
                        - Traditional
                        - UserDefined
                        - WorldMusic
                    groups:
                        - xsd_rules
        languageAndScriptCode:
            -
                Regex:
                    pattern: '~[a-zA-Z]{2,3}(-[a-zA-Z]+){0,1}(-[a-zA-Z]{2}|-[0-9]{3}){0,1}(-[a-zA-Z][a-zA-Z0-9]{4}[a-zA-Z0-9]*){0,1}~u'
                    groups:
                        - xsd_rules
