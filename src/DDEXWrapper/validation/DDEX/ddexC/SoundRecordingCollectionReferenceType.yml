DDEX\ddexC\SoundRecordingCollectionReferenceType:
    properties:
        sequenceNumber:
            -
                Regex:
                    pattern: '~[\-+]?[0-9]+~u'
                    groups:
                        - xsd_rules
        soundRecordingCollectionReference:
            -
                Regex:
                    pattern: '~X[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        releaseResourceType:
            -
                Choice:
                    choices:
                        - PrimaryResource
                        - SecondaryResource
                    groups:
                        - xsd_rules
