DDEX\ERN\ERN_350\TechnicalVideoDetailsType:
    properties:
        technicalResourceDetailsReference:
            -
                Regex:
                    pattern: '~T[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        colorDepth:
            -
                Regex:
                    pattern: '~[\-+]?[0-9]+~u'
                    groups:
                        - xsd_rules
        videoDefinitionType:
            -
                Choice:
                    choices:
                        - HighDefinition
                        - StandardDefinition
                    groups:
                        - xsd_rules
        numberOfAudioChannels:
            -
                Regex:
                    pattern: '~[\-+]?[0-9]+~u'
                    groups:
                        - xsd_rules
        audioBitsPerSample:
            -
                Regex:
                    pattern: '~[\-+]?[0-9]+~u'
                    groups:
                        - xsd_rules
        previewDetails:
            -
                Valid: null
        fulfillmentDate:
            -
                Valid: null
        consumerFulfillmentDate:
            -
                Valid: null
        file:
            -
                Valid: null
        fingerprint:
            -
                Valid: null
