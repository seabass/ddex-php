DDEX\ERN\ERN_351\RightsControllerType:
    properties:
        sequenceNumber:
            -
                Regex:
                    pattern: '~[\-+]?[0-9]+~u'
                    groups:
                        - xsd_rules
        partyName:
            -
                Valid: null
        rightsControllerRole:
            -
                All:
                    constraints:
                        -
                            Choice:
                                choices:
                                    - AdministratingRecordCompany
                                    - RightsAdministrator
                                    - RightsController
                                    - RoyaltyAdministrator
                                    - Unknown
                    groups:
                        - xsd_rules
        rightsControllerType:
            -
                Choice:
                    choices:
                        - OriginalOwner
                        - SuccessorInTitle
                        - ExclusiveLicensee
                    groups:
                        - xsd_rules
        startDate:
            -
                NotNull:
                    groups:
                        - xsd_rules
