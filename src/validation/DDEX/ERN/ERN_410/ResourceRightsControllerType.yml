DDEX\ERN\ERN_410\ResourceRightsControllerType:
    properties:
        sequenceNumber:
            -
                Regex:
                    pattern: '~[\-+]?[0-9]+~u'
                    groups:
                        - xsd_rules
        partyId:
            -
                Valid: null
        partyName:
            -
                Valid: null
        rightsControllerRole:
            -
                All:
                    constraints:
                        -
                            Choice:
                                choices:
                                    - AdministratingRecordCompany
                                    - RightsAdministrator
                                    - RightsController
                                    - RoyaltyAdministrator
                                    - Unknown
                                    - LocalPayee
                    groups:
                        - xsd_rules
        delegatedUsageRights:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
