DDEX\ERN\ERN_411\RelatedResourceType:
    properties:
        resourceRelationshipType:
            -
                Choice:
                    choices:
                        - HasContentFrom
                        - IsCoveredBy
                        - IsCoverOf
                        - IsPartOf
                        - UserDefined
                        - IsDifferentEncoding
                        - ContainsSamplesFrom
                        - IsSampledBy
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        resourceRelatedResourceReference:
            -
                Regex:
                    pattern: '~A[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
        releaseId:
            -
                Valid: null
        timing:
            -
                Valid: null
