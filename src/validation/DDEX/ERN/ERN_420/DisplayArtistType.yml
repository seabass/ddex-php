DDEX\ERN\ERN_420\DisplayArtistType:
    properties:
        sequenceNumber:
            -
                Regex:
                    pattern: '~[\-+]?[0-9]+~u'
                    groups:
                        - xsd_rules
        artistPartyReference:
            -
                Regex:
                    pattern: '~P[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        displayArtistRole:
            -
                NotNull:
                    groups:
                        - xsd_rules
        titleDisplayInformation:
            -
                Valid: null
