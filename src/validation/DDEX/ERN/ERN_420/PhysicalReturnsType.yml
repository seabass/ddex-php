DDEX\ERN\ERN_420\PhysicalReturnsType:
    properties:
        physicalReturnsAllowed:
            -
                NotNull:
                    groups:
                        - xsd_rules
        latestDateForPhysicalReturns:
            -
                Regex:
                    pattern: '~[0-9]{4}(-[0-9]{2}){0,1}(-[0-9]{2}){0,1}~u'
                    groups:
                        - xsd_rules
