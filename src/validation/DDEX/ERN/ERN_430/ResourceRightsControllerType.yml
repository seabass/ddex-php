DDEX\ERN\ERN_430\ResourceRightsControllerType:
    properties:
        sequenceNumber:
            -
                Regex:
                    pattern: '~[\-+]?[0-9]+~u'
                    groups:
                        - xsd_rules
        rightsControllerPartyReference:
            -
                Regex:
                    pattern: '~P[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        rightsControlType:
            -
                All:
                    constraints:
                        -
                            Choice:
                                choices:
                                    - AdministratingRecordCompany
                                    - LocalPayee
                                    - RightsAdministrator
                                    - RightsController
                                    - RightsHolder
                                    - RoyaltyAdministrator
                                    - Unknown
                    groups:
                        - xsd_rules
        delegatedUsageRights:
            -
                Valid: null
