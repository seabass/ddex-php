DDEX\ERN\ERN_430\VideoType:
    properties:
        languageAndScriptCode:
            -
                Regex:
                    pattern: '~[a-zA-Z]{2,3}(-[a-zA-Z]+){0,1}(-[a-zA-Z]{2}|-[0-9]{3}){0,1}(-[a-zA-Z][a-zA-Z0-9]{4}[a-zA-Z0-9]*){0,1}~u'
                    groups:
                        - xsd_rules
        resourceReference:
            -
                Regex:
                    pattern: '~A[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        type:
            -
                NotNull:
                    groups:
                        - xsd_rules
        videoEdition:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        workId:
            -
                Valid: null
        displayTitleText:
            -
                NotNull:
                    groups:
                        - xsd_rules
        displayTitle:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        additionalTitle:
            -
                Valid: null
        displayArtistName:
            -
                NotNull:
                    groups:
                        - xsd_rules
        displayArtist:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        contributor:
            -
                Valid: null
        character:
            -
                Valid: null
        resourceRightsController:
            -
                Valid: null
        workRightsController:
            -
                Valid: null
        duration:
            -
                NotNull:
                    groups:
                        - xsd_rules
        firstPublicationDate:
            -
                Valid: null
        parentalWarningType:
            -
                NotNull:
                    groups:
                        - xsd_rules
        avRating:
            -
                Valid: null
        relatedRelease:
            -
                Valid: null
        relatedResource:
            -
                Valid: null
        compositeMusicalWorkType:
            -
                Choice:
                    choices:
                        - Medley
                        - Neither
                        - Potpourri
                    groups:
                        - xsd_rules
        videoCueSheetReference:
            -
                All:
                    constraints:
                        -
                            Regex:
                                pattern: '~Q[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
        displayCredits:
            -
                Valid: null
        languageOfDubbing:
            -
                All:
                    constraints:
                        -
                            Regex:
                                pattern: '~[a-zA-Z]{2,3}(-[a-zA-Z]+){0,1}(-[a-zA-Z]{2}|-[0-9]{3}){0,1}(-[a-zA-Z][a-zA-Z0-9]{4}[a-zA-Z0-9]*){0,1}~u'
                    groups:
                        - xsd_rules
        subTitleLanguage:
            -
                All:
                    constraints:
                        -
                            Regex:
                                pattern: '~[a-zA-Z]{2,3}(-[a-zA-Z]+){0,1}(-[a-zA-Z]{2}|-[0-9]{3}){0,1}(-[a-zA-Z][a-zA-Z0-9]{4}[a-zA-Z0-9]*){0,1}~u'
                    groups:
                        - xsd_rules
        resourceContainedResourceReferenceList:
            -
                Valid: null
        videoChapterReference:
            -
                All:
                    constraints:
                        -
                            Regex:
                                pattern: '~X[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
