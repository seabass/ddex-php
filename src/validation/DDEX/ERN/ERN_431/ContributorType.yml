DDEX\ERN\ERN_431\ContributorType:
    properties:
        sequenceNumber:
            -
                Regex:
                    pattern: '~[\-+]?[0-9]+~u'
                    groups:
                        - xsd_rules
        contributorPartyReference:
            -
                Regex:
                    pattern: '~P[_0-9a-zA-Z-]+~u'
                    groups:
                        - xsd_rules
        role:
            -
                Valid: null
        aiContribution:
            -
                Choice:
                    choices:
                        - All
                        - None
                        - Partly
                    groups:
                        - xsd_rules
        displayCredits:
            -
                Valid: null
