DDEX\ERN\ERN_431\DisplayArtistType:
    properties:
        sequenceNumber:
            -
                Regex:
                    pattern: '~[\-+]?[0-9]+~u'
                    groups:
                        - xsd_rules
        artistPartyReference:
            -
                Regex:
                    pattern: '~P[_0-9a-zA-Z-]+~u'
                    groups:
                        - xsd_rules
        artisticRole:
            -
                Valid: null
        titleDisplayInformation:
            -
                Valid: null
        displayCredits:
            -
                Valid: null
