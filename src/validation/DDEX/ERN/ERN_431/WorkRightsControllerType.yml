DDEX\ERN\ERN_431\WorkRightsControllerType:
    properties:
        rightsControllerPartyReference:
            -
                Regex:
                    pattern: '~P[_0-9a-zA-Z-]+~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        rightsControlType:
            -
                All:
                    constraints:
                        -
                            Choice:
                                choices:
                                    - AdministratingRecordCompany
                                    - LocalPayee
                                    - RightsAdministrator
                                    - RightsController
                                    - RightsHolder
                                    - RoyaltyAdministrator
                                    - Unknown
                    groups:
                        - xsd_rules
        rightsControllerType:
            -
                Choice:
                    choices:
                        - OriginalOwner
                        - SuccessorInTitle
                        - ExclusiveLicensee
                    groups:
                        - xsd_rules
        startDate:
            -
                Regex:
                    pattern: '~[0-9]{4}(-[0-9]{2}){0,1}(-[0-9]{2}){0,1}~u'
                    groups:
                        - xsd_rules
        endDate:
            -
                Regex:
                    pattern: '~[0-9]{4}(-[0-9]{2}){0,1}(-[0-9]{2}){0,1}~u'
                    groups:
                        - xsd_rules
