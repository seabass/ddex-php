DDEX\ERN\ERN_432\ChapterType:
    properties:
        languageAndScriptCode:
            -
                Regex:
                    pattern: '~[a-zA-Z]{2,3}(-[a-zA-Z]+){0,1}(-[a-zA-Z]{2}|-[0-9]{3}){0,1}(-[a-zA-Z][a-zA-Z0-9]{4}[a-zA-Z0-9]*){0,1}~u'
                    groups:
                        - xsd_rules
        chapterReference:
            -
                Regex:
                    pattern: '~X[_0-9a-zA-Z-]+~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        chapterId:
            -
                Valid: null
        displayTitle:
            -
                Valid: null
        formalTitle:
            -
                Valid: null
        groupingTitle:
            -
                Valid: null
        sequenceNumber:
            -
                Regex:
                    pattern: '~[\-+]?[0-9]+~u'
                    groups:
                        - xsd_rules
        contributor:
            -
                Valid: null
        character:
            -
                Valid: null
        representativeImageReference:
            -
                Regex:
                    pattern: '~A[_0-9a-zA-Z-]+~u'
                    groups:
                        - xsd_rules
