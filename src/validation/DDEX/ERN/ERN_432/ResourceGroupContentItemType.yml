DDEX\ERN\ERN_432\ResourceGroupContentItemType:
    properties:
        sequenceNumber:
            -
                Regex:
                    pattern: '~[\-+]?[0-9]+~u'
                    groups:
                        - xsd_rules
        releaseResourceReference:
            -
                Regex:
                    pattern: '~A[_0-9a-zA-Z-]+~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
