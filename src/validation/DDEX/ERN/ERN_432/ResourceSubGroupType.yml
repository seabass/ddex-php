DDEX\ERN\ERN_432\ResourceSubGroupType:
    properties:
        resourceGroupType:
            -
                Choice:
                    choices:
                        - Component
                        - ComponentRelease
                        - MultiWorkPart
                        - ReleaseComponent
                        - Side
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        displayTitle:
            -
                Valid: null
        formalTitle:
            -
                Valid: null
        groupingTitle:
            -
                Valid: null
        sequenceNumber:
            -
                Regex:
                    pattern: '~[\-+]?[0-9]+~u'
                    groups:
                        - xsd_rules
        displayArtist:
            -
                Valid: null
        resourceGroupReleaseReference:
            -
                Regex:
                    pattern: '~R[_0-9a-zA-Z-]+~u'
                    groups:
                        - xsd_rules
        releaseId:
            -
                Valid: null
        resourceGroup:
            -
                Valid: null
        resourceGroupContentItem:
            -
                Valid: null
