DDEX\ERN\ERN_432\VideoClipDetailsType:
    properties:
        technicalResourceDetailsReference:
            -
                Regex:
                    pattern: '~T[_0-9a-zA-Z-]+~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        clipType:
            -
                NotNull:
                    groups:
                        - xsd_rules
        timing:
            -
                Valid: null
        topLeftCorner:
            -
                Regex:
                    pattern: '~[0-9]+,[0-9]+~u'
                    groups:
                        - xsd_rules
        bottomRightCorner:
            -
                Regex:
                    pattern: '~[0-9]+,[0-9]+~u'
                    groups:
                        - xsd_rules
        expressionType:
            -
                Choice:
                    choices:
                        - Informative
                        - Instructive
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        deliveryFile:
            -
                Valid: null
