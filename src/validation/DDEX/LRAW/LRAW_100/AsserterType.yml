DDEX\LRAW\LRAW_100\AsserterType:
    properties:
        __value:
            -
                Regex:
                    pattern: '~P[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
        asserterType:
            -
                Choice:
                    choices:
                        - CollectionSociety
                        - InterestedPublisher
                        - MusicLicensingCompany
                        - Publisher
                        - RecordCompanyWithInterestInResource
                        - ThirdParty
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
