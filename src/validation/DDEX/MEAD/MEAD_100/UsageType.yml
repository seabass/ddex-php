DDEX\MEAD\MEAD_100\UsageType:
    properties:
        metadataSourceReference:
            -
                All:
                    constraints:
                        -
                            Regex:
                                pattern: '~U[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
        usagePeriod:
            -
                Valid: null
        sequenceNumber:
            -
                Regex:
                    pattern: '~[\-+]?[0-9]+~u'
                    groups:
                        - xsd_rules
        relevantResource:
            -
                Valid: null
