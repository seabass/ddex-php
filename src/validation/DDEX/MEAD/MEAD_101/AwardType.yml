DDEX\MEAD\MEAD_101\AwardType:
    properties:
        metadataSourceReference:
            -
                All:
                    constraints:
                        -
                            Regex:
                                pattern: '~U[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
        awardingBody:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        awardedParty:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        awardName:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        date:
            -
                NotNull:
                    groups:
                        - xsd_rules
        isWinner:
            -
                NotNull:
                    groups:
                        - xsd_rules
