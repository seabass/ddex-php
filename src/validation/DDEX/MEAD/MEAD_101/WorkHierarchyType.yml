DDEX\MEAD\MEAD_101\WorkHierarchyType:
    properties:
        metadataSourceReference:
            -
                All:
                    constraints:
                        -
                            Regex:
                                pattern: '~U[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
        isDescribedElement:
            -
                NotNull:
                    groups:
                        - xsd_rules
        sequenceNumber:
            -
                Regex:
                    pattern: '~[\-+]?[0-9]+~u'
                    groups:
                        - xsd_rules
        workId:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        child:
            -
                Valid: null
        form:
            -
                Valid: null
