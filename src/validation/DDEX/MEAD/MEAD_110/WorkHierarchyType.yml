DDEX\MEAD\MEAD_110\WorkHierarchyType:
    properties:
        isDescribedElement:
            -
                NotNull:
                    groups:
                        - xsd_rules
        sequenceNumber:
            -
                Regex:
                    pattern: '~[\-+]?[0-9]+~u'
                    groups:
                        - xsd_rules
        workId:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        child:
            -
                Valid: null
        form:
            -
                Valid: null
