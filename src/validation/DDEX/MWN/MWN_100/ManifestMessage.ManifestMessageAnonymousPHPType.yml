DDEX\MWN\MWN_100\ManifestMessage\ManifestMessageAnonymousPHPType:
    properties:
        ftpMessageHeader:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        isTestFlag:
            -
                NotNull:
                    groups:
                        - xsd_rules
        rootDirectory:
            -
                NotNull:
                    groups:
                        - xsd_rules
        numberOfMessages:
            -
                Regex:
                    pattern: '~[\-+]?[0-9]+~u'
                    groups:
                        - xsd_rules
