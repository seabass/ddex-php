DDEX\MWN\MWN_100\ReceivedFileType:
    properties:
        fileName:
            -
                NotNull:
                    groups:
                        - xsd_rules
        fileStatus:
            -
                Choice:
                    choices:
                        - FileMissing
                        - FileOK
                        - HashSumWrong
                        - SignatureWrong
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        hashSum:
            -
                Valid: null
        signature:
            -
                Valid: null
