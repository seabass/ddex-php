DDEX\MWN\MWN_100\RightShareType:
    properties:
        rightShareId:
            -
                Valid: null
        rightShareReference:
            -
                Regex:
                    pattern: '~S[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        rightShareCreationReferenceList:
            -
                Valid: null
        rightShareType:
            -
                Choice:
                    choices:
                        - MusicalWorkManuscriptShare
                        - MusicalWorkCollectionShare
                        - OriginalPublisherShare
                        - LicensingShare
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        musicalWorkRightsClaimType:
            -
                All:
                    constraints:
                        -
                            Choice:
                                choices:
                                    - CopyrightControl
                                    - NonMemberClaim
                                    - PublicDomain
                                    - SocietyClaim
                                    - Unknown
                    groups:
                        - xsd_rules
        rightsController:
            -
                Valid: null
        validityPeriod:
            -
                Valid: null
        licenseStatus:
            -
                Choice:
                    choices:
                        - Active
                        - Pending
                        - Revoked
                    groups:
                        - xsd_rules
        assumedDateOfTransitionIntoPublicDomain:
            -
                Regex:
                    pattern: '~[0-9]{4}(-[0-9]{2}){0,1}(-[0-9]{2}){0,1}~u'
                    groups:
                        - xsd_rules
        rightShareRightShareReference:
            -
                All:
                    constraints:
                        -
                            Regex:
                                pattern: '~S[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
        rightsClaimPolicy:
            -
                Valid: null
        relatedRightShare:
            -
                Valid: null
        hasOriginalPublisherShare:
            -
                Valid: null
        isFollowerInTitleOf:
            -
                Valid: null
