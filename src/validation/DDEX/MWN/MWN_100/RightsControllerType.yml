DDEX\MWN\MWN_100\RightsControllerType:
    properties:
        sequenceNumber:
            -
                Regex:
                    pattern: '~[\-+]?[0-9]+~u'
                    groups:
                        - xsd_rules
        rightsControllerPartyReference:
            -
                Regex:
                    pattern: '~P[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        rightsControllerRole:
            -
                All:
                    constraints:
                        -
                            Choice:
                                choices:
                                    - AdministratingRecordCompany
                                    - RightsAdministrator
                                    - RightsController
                                    - RoyaltyAdministrator
                                    - Unknown
                                    - LocalPayee
                    groups:
                        - xsd_rules
        rightsControllerType:
            -
                Choice:
                    choices:
                        - OriginalOwner
                        - SuccessorInTitle
                        - ExclusiveLicensee
                    groups:
                        - xsd_rules
