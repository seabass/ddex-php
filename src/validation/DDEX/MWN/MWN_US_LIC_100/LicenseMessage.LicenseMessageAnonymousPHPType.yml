DDEX\MWN\MWN_US_LIC_100\LicenseMessage\LicenseMessageAnonymousPHPType:
    properties:
        avsVersionId:
            -
                Choice:
                    choices:
                        - '0.1'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        languageAndScriptCode:
            -
                Regex:
                    pattern: '~[a-zA-Z]{2,3}(-[a-zA-Z]+){0,1}(-[a-zA-Z]{2}|-[0-9]{3}){0,1}(-[a-zA-Z][a-zA-Z0-9]{4}[a-zA-Z0-9]*){0,1}~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        messageHeader:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        messagePurpose:
            -
                Choice:
                    choices:
                        - License
                        - NdmaLicense
                        - Acknowledgement
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        partyList:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Count:
                    min: 1
                    groups:
                        - xsd_rules
            -
                Valid: null
        workList:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Count:
                    min: 1
                    groups:
                        - xsd_rules
            -
                Valid: null
        rightShareList:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Count:
                    min: 1
                    groups:
                        - xsd_rules
            -
                Valid: null
        licenseList:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
