DDEX\MWN\MWN_US_LIC_100\StatusType:
    properties:
        claimStatus:
            -
                Choice:
                    choices:
                        - CompleteClaim
                        - CompleteUnderClaim
                        - IncompleteClaim
                        - IncompleteUnderClaim
                        - MajorOverClaim
                        - MinorOverClaim
                        - OverClaim
                        - UnderClaim
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        rightsType:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                All:
                    constraints:
                        -
                            Choice:
                                choices:
                                    - MechanicalRight
                                    - PerformingRight
                                    - PrintRight
                                    - SynchronizationRight
                    groups:
                        - xsd_rules
        claimStatusDate:
            -
                Regex:
                    pattern: '~[0-9]{4}(-[0-9]{2}){0,1}(-[0-9]{2}){0,1}~u'
                    groups:
                        - xsd_rules
