DDEX\MWN\MWN_US_LIC_101\VideoType:
    properties:
        resourceReference:
            -
                Regex:
                    pattern: '~A[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        videoId:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        title:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        resourceMusicalWorkReferenceList:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Count:
                    min: 1
                    groups:
                        - xsd_rules
            -
                Valid: null
        pLine:
            -
                Valid: null
        cLine:
            -
                Valid: null
