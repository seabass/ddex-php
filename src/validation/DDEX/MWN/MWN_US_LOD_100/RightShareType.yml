DDEX\MWN\MWN_US_LOD_100\RightShareType:
    properties:
        rightShareReference:
            -
                Regex:
                    pattern: '~S[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        rightShareType:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                All:
                    constraints:
                        -
                            Choice:
                                choices:
                                    - LicensingShare
                                    - MusicalWorkCollectionShare
                                    - MusicalWorkManuscriptShare
                                    - OriginalPublisherShare
                    groups:
                        - xsd_rules
        rightShareWorkReference:
            -
                Regex:
                    pattern: '~W[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        territoryCode:
            -
                NotNull:
                    groups:
                        - xsd_rules
        rightsType:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                All:
                    constraints:
                        -
                            Choice:
                                choices:
                                    - MechanicalRight
                                    - PerformingRight
                                    - PrintRight
                                    - SynchronizationRight
                    groups:
                        - xsd_rules
        rightsController:
            -
                Valid: null
        licensingAgent:
            -
                Valid: null
        validityPeriod:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        rightsClaimPolicy:
            -
                Valid: null
        hasOriginalPublisherShare:
            -
                Valid: null
        isFollowerInTitleOf:
            -
                Valid: null
