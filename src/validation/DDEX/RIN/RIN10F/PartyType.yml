DDEX\RIN\RIN10F\PartyType:
    properties:
        partyId:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        partyReference:
            -
                Regex:
                    pattern: '~P[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        partyName:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        publisher:
            -
                Valid: null
        authorsSociety:
            -
                Valid: null
        label:
            -
                Valid: null
        musicLicensingCompany:
            -
                Valid: null
        sex:
            -
                Choice:
                    choices:
                        - Female
                        - Male
                        - Unknown
                    groups:
                        - xsd_rules
        artistDelegatedUsageRights:
            -
                Valid: null
        isOrganization:
            -
                NotNull:
                    groups:
                        - xsd_rules
        postalAddress:
            -
                Valid: null
