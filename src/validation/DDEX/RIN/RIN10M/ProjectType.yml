DDEX\RIN\RIN10M\ProjectType:
    properties:
        projectReference:
            -
                Regex:
                    pattern: '~J[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        mainArtist:
            -
                All:
                    constraints:
                        -
                            Regex:
                                pattern: '~P[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
        label:
            -
                All:
                    constraints:
                        -
                            Regex:
                                pattern: '~P[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
        contributorReference:
            -
                Valid: null
