DDEX\RIN\RIN11F\DetailsType:
    properties:
        sequenceNumber:
            -
                Regex:
                    pattern: '~[\-+]?[0-9]+~u'
                    groups:
                        - xsd_rules
        transferCategory:
            -
                Choice:
                    choices:
                        - AlignmentTones
                        - AnalogToDigitalConverter
                        - BitDepth
                        - Cartridge
                        - NumberOfChannels
                        - ClockSource
                        - MaterialCondition
                        - ConversionReferenceLevel
                        - Emphasis
                        - MicPreamp
                        - NoiseReduction
                        - PhonoPreamp
                        - ReferenceClock
                        - ReferenceTones
                        - SamplingRate
                        - Side1Condition
                        - Side2Condition
                        - NumberOfSides
                        - SmpteFrameRate
                        - SourceMachine
                        - Speed
                        - Storage
                        - Stylus
                        - StylusSize
                        - TapeBakedDate
                        - TapeBakedEquipment
                        - TapeBakedHours
                        - TapeBakedTemperature
                        - TapeCoolHours
                        - Tonearm
                        - TrackConfiguration
                        - NumberOfTracks
                        - TransferSoftware
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        description:
            -
                NotNull:
                    groups:
                        - xsd_rules
