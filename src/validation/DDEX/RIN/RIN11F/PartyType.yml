DDEX\RIN\RIN11F\PartyType:
    properties:
        partyId:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        partyReference:
            -
                Regex:
                    pattern: '~P[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        partyName:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        affiliation:
            -
                Valid: null
        relatedParty:
            -
                Valid: null
        gender:
            -
                Choice:
                    choices:
                        - Androgynous
                        - Feminine
                        - Masculine
                        - Unknown
                    groups:
                        - xsd_rules
        isOrganization:
            -
                NotNull:
                    groups:
                        - xsd_rules
        postalAddress:
            -
                Valid: null
