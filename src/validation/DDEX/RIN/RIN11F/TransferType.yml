DDEX\RIN\RIN11F\TransferType:
    properties:
        transferReference:
            -
                Regex:
                    pattern: '~N[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        transferType:
            -
                Choice:
                    choices:
                        - AnalogToAnalog
                        - AnalogToDigital
                        - DigitalCopy
                        - DigitalToAnalog
                        - DigitalToDigital
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        transferEquipmentReference:
            -
                Regex:
                    pattern: '~I[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
        transferSessionReference:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                All:
                    constraints:
                        -
                            Regex:
                                pattern: '~O[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
        transferSource:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
        transferDestination:
            -
                NotNull:
                    groups:
                        - xsd_rules
            -
                Valid: null
