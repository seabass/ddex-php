    properties:
        projectReference:
            -
                Regex:
                    pattern: '~J[\d\-_a-zA-Z]+~u'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        displayArtist:
            -
                Valid: null
        projectLabelReference:
