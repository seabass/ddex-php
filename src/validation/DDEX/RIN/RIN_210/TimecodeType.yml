DDEX\RIN\RIN_210\TimecodeType:
    properties:
        timecodeType:
            -
                Choice:
                    choices:
                        - FSK
                        - MIDI
                        - SMPTE
                        - VITC
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        frameRate:
            -
                Choice:
                    choices:
                        - '24'
                        - '25'
                        - '29.97'
                        - '30'
                    groups:
                        - xsd_rules
            -
                NotNull:
                    groups:
                        - xsd_rules
        isDropFrame:
            -
                NotNull:
                    groups:
                        - xsd_rules
